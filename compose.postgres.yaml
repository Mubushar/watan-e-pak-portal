services:
  postgres:
    build:
      context: .
      dockerfile: backend/Postgres.Dockerfile
    image: watanepak-postgis-pgvector:17-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watanepak}
      POSTGRES_USER: ${POSTGRES_USER:-watanepak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-watanepak}:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/${POSTGRES_DB:-watanepak}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
