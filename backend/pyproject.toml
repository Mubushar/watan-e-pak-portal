[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mubashar", email = "mubushar@yahoo.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pillow>=11",
    "pypdf>=6.21.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Durable storage on PostgreSQL (DATABASE_URL=postgresql://...); SQLite is used without it.
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
